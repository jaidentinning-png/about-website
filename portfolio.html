<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jai | Developer Portfolio</title>
    <link rel="stylesheet" href="assets/css/portfolio.css">
</head>
<body>
    <div class="noise" aria-hidden="true"></div>
    <header class="siteHeader">
        <a class="wordmark glitchText" href="portfolio.html">JAI<span>/DEV</span></a>
        <nav aria-label="Portfolio navigation">
            <a class="glitchText" href="#work">WORK</a>
            <a class="glitchText" href="#about">ABOUT</a>
            <a class="glitchText" href="#contact">CONTACT</a>
            <a class="backLink glitchText" href="index.html">MAIN</a>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="portfolioTitle">
            <p class="eyebrow" id="portfolioRole"></p>
            <h1 class="glitchTitle" id="portfolioTitle">Developer<br><span>Portfolio.</span></h1>
            <p class="heroSummary" id="portfolioSummary"></p>
            <a class="primaryLink" href="#work">View selected work <span aria-hidden="true">↓</span></a>
        </section>

        <section class="work" id="work">
            <div class="sectionHeading">
                <p>Selected projects</p>
                <span id="projectCount"></span>
            </div>
            <div class="projectGrid" id="projectGrid"></div>
        </section>

        <section class="about" id="about">
            <div class="sectionHeading"><p>About</p><span>01</span></div>
            <div class="aboutGrid">
                <h2>Building useful things with personality.</h2>
                <div>
                    <p class="bodyCopy" id="portfolioAbout"></p>
                    <h3>What I do</h3>
                    <ul class="serviceList" id="servicesList"></ul>
                </div>
                <div>
                    <h3>Skills</h3>
                    <ul class="skillList" id="skillList"></ul>
                    <h3>Currently</h3>
                    <p class="bodyCopy" id="portfolioNow"></p>
                </div>
            </div>
        </section>

        <section class="contact" id="contact">
            <p>Have a project in mind?</p>
            <a id="contactLink" href="#">Let's talk.</a>
        </section>
    </main>

    <script src="portfolio-data.js"></script>
    <script src="projects-data.js"></script>
    <script src="assets/js/portfolio.js"></script>
</body>
</html>
