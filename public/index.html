<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <title>My Portfolio</title>
  <meta name="description" content="Personal portfolio, projects, promotions, and support tickets.">
  <link rel="icon" type="image/jpeg" href="/site-logo.jpg">
  <link rel="stylesheet" href="/styles.css?v=20">
  <script src="/app.js?v=20" defer></script>
</head>
<body>
  <div id="site" class="siteShell">
    <header class="siteHeader">
      <a class="siteBrand" href="#home" aria-label="Home">
        <img src="/site-logo.jpg" alt="Site logo">
        <span class="siteBrandText" data-bind="name">Your Name</span>
      </a>
      <button class="menuButton" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="siteNav" aria-label="Primary navigation">
        <a href="#home" data-route="home">Home</a>
        <a href="#about" data-route="about">About</a>
        <a href="#portfolio" data-route="portfolio">Portfolio</a>
        <a href="#promotions" data-route="promotions">Promotions</a>
        <a href="#support" data-route="support">Support</a>
      </nav>
      <a class="panelLink" href="#panel" data-route="panel">Panel</a>
    </header>

    <main id="content" class="siteContent" tabindex="-1"></main>

    <footer class="siteFooter">
      <div><img src="/site-logo.jpg" alt=""><strong data-bind="name">Your Name</strong></div>
      <p>© <span id="footerYear"></span> <span data-bind="name">Your Name</span>. All rights reserved.</p>
      <a href="#support">Support ticket</a>
    </footer>
  </div>
  <dialog id="siteDialog" class="siteDialog"><div id="siteDialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
